services:
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    ports:
    - 3000:3000
    depends_on:
      gateway:
        condition: service_healthy
  gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/gateway.Dockerfile
    environment:
      PORT: 4000
      AI_SERVICE_BASE_URL: http://ai-service:8000
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: verideploy-gateway
      OIDC_ISSUER_URL: http://keycloak:8080/realms/verideploy
      OIDC_CLIENT_ID: verideploy-web
      OIDC_AUDIENCE: verideploy-web
      GATEWAY_DEV_AUTH_BYPASS: 'true'
      PLATFORM_DEPENDENCY_READINESS_ENABLED: 'true'
    ports:
    - 4000:4000
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:4000/api/v1/health/ready
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      ai-service:
        condition: service_healthy
      kafka:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    env_file:
    - .env
    restart: unless-stopped
  db-migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/ai.Dockerfile
    command:
    - alembic
    - upgrade
    - head
    env_file:
    - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  ai-service:
    build:
      context: .
      dockerfile: infrastructure/docker/ai.Dockerfile
    env_file:
    - .env
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      PLATFORM_DEPENDENCY_READINESS_ENABLED: 'true'
      PLATFORM_READINESS_TIMEOUT_SECONDS: '1.5'
  release-risk-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/ai.Dockerfile
    command:
    - python
    - -m
    - workers.investigation.release_risk_main
    env_file:
    - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  ingestion-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/ai.Dockerfile
    command:
    - python
    - -m
    - workers.ingestion.ingestion_main
    env_file:
    - .env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      minio:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  investigation-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/ai.Dockerfile
    command:
    - python
    - -m
    - workers.investigation.investigation_main
    env_file:
    - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: verideploy
      POSTGRES_PASSWORD: verideploy
      POSTGRES_DB: verideploy
    ports:
    - 5433:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U verideploy -d verideploy
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    ports:
    - 6380:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  kafka:
    image: bitnamilegacy/kafka:3.9
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
        >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: verideploy-local
      MINIO_ROOT_PASSWORD: replace-in-local-env
    ports:
    - 9000:9000
    - 9001:9001
    volumes:
    - minio_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:9000/minio/health/ready >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
  otel-collector:
    depends_on:
      tempo:
        condition: service_started
    image: otel/opentelemetry-collector-contrib:0.123.0
    command:
    - --config=/etc/otelcol-contrib/config.yaml
    volumes:
    - ./infrastructure/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
    - 4317:4317
    - 4318:4318
    - 9464:9464
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.3.0
    volumes:
    - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
    - 9090:9090
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.6.0
    ports:
    - 3100:3000
    volumes:
    - grafana_data:/var/lib/grafana
    restart: unless-stopped
  loki:
    image: grafana/loki:3.5.0
    command:
    - -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
  tempo:
    image: grafana/tempo:2.7.2
    command:
    - -config.file=/etc/tempo.yaml
    volumes:
    - ./infrastructure/observability/tempo.yaml:/etc/tempo.yaml:ro
    restart: unless-stopped
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
    - /bin/sh
    - -c
    command:
    - until mc alias set local http://minio:9000 verideploy-local replace-in-local-env;
      do sleep 2; done; mc mb --ignore-existing local/verideploy-evidence; mc anonymous
      set none local/verideploy-evidence
  kafka-init:
    image: bitnamilegacy/kafka:3.9
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
    - /bin/bash
    - -ec
    command:
    - for t in verideploy.commands.release-risk.v1 verideploy.events.release-risk.v1
      verideploy.commands.investigation.v1 verideploy.commands.investigation-cancel.v1
      verideploy.events.investigation.v1 verideploy.commands.ingestion.v1 verideploy.events.ingestion.v1
      verideploy.commands.postmortem.v1 verideploy.events.postmortem.v1 verideploy.commands.audio-transcription.v1
      verideploy.events.audio-transcription.v1 verideploy.commands.video-evidence.v1
      verideploy.events.video-evidence.v1; do /opt/bitnami/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$t" --partitions
      3 --replication-factor 1; done
  postmortem-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/ai.Dockerfile
    command:
    - python
    - -m
    - workers.postmortem.postmortem_main
    env_file:
    - .env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  audio-transcription-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/ai.Dockerfile
    command:
    - python
    - -m
    - workers.multimodal.audio_transcription_main
    env_file:
    - .env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      minio:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  video-evidence-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/ai.Dockerfile
    command:
    - python
    - -m
    - workers.multimodal.video_evidence_main
    env_file:
    - .env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      minio:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command:
    - start-dev
    - --import-realm
    - --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-development-only-change-me
      KC_HEALTH_ENABLED: 'true'
    volumes:
    - ./infrastructure/identity/verideploy-realm.json:/opt/keycloak/data/import/verideploy-realm.json:ro
    ports:
    - 8080:8080
    healthcheck:
      test:
      - CMD-SHELL
      - bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped
volumes:
  postgres_data: {}
  minio_data: {}
  grafana_data: {}
