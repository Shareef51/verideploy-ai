openapi: 3.1.0
info:
  title: VeriDeploy AI Public Gateway API
  version: 0.49.0
servers:
- url: http://localhost:4000/api/v1
paths:
  /health/live:
    get:
      operationId: gatewayLiveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      operationId: gatewayReadiness
      responses:
        '200':
          description: Required service dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /releases/risk-assessments:
    get:
      operationId: listReleaseRiskAssessments
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Recent tenant-scoped release risk assessments for the selector
    post:
      operationId: createReleaseRiskAssessment
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReleaseRiskRequest'
      responses:
        '202':
          description: Assessment accepted and current authoritative state returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseRiskRecord'
        '400':
          description: Invalid request
        '503':
          description: Private risk service unavailable
  /releases/risk-assessments/{assessmentId}:
    get:
      operationId: getReleaseRiskAssessment
      parameters:
      - name: assessmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Tenant-scoped authoritative release-risk state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseRiskRecord'
        '404':
          description: Assessment not found
  /releases/risk-assessments/{assessmentId}/stream:
    get:
      operationId: streamReleaseRiskAssessment
      parameters:
      - name: assessmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Server-sent authoritative release-risk events
          content:
            text/event-stream:
              schema:
                type: string
  /investigations:
    post:
      operationId: createInvestigation
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvestigationRequest'
      responses:
        '202':
          description: Investigation command durably accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationAccepted'
        '400':
          description: Invalid request
        '503':
          description: Command bus unavailable
    get:
      operationId: listInvestigations
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Tenant-scoped investigations
  /investigations/{investigationId}:
    get:
      operationId: getInvestigation
      parameters:
      - &id001
        name: investigationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - &id002
        $ref: '#/components/parameters/TenantId'
      - &id003
        $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Authoritative investigation snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationRecord'
        '404':
          description: Investigation not found
  /investigations/{investigationId}/view:
    get:
      operationId: getInvestigationView
      parameters:
      - *id001
      - *id002
      - *id003
      responses:
        '200':
          description: Authoritative incident-investigation projection for timeline, hypotheses, RCA, alternatives, and evidence map
        '404':
          description: Investigation not found
  /investigations/{investigationId}/events:
    get:
      operationId: replayInvestigationEvents
      parameters:
      - *id001
      - *id002
      - *id003
      - name: after_sequence
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Ordered durable event replay
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvestigationEvent'
  /investigations/{investigationId}/cancel:
    post:
      operationId: cancelInvestigation
      parameters:
      - *id001
      - *id002
      - *id003
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
      responses:
        '202':
          description: Cancellation command accepted
        '404':
          description: Investigation not found
  /investigations/{investigationId}/stream:
    get:
      operationId: streamInvestigationEvents
      parameters:
      - *id001
      - *id002
      - *id003
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: SSE replay followed by live Kafka-backed progress stream
          content:
            text/event-stream:
              schema:
                type: string
  /ingestion/documents:
    post:
      operationId: uploadDocuments
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: File signature validated, object stored, processing command
            queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionAccepted'
        '400':
          description: Invalid file, type mismatch, or size limit exceeded
        '503':
          description: Object storage or command bus unavailable
  /ingestion/images:
    post:
      operationId: uploadImages
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: File signature validated, object stored, processing command
            queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionAccepted'
        '400':
          description: Invalid file, type mismatch, or size limit exceeded
        '503':
          description: Object storage or command bus unavailable
  /ingestion/audio:
    post:
      operationId: uploadAudio
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: File signature validated, object stored, processing command
            queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionAccepted'
        '400':
          description: Invalid file, type mismatch, or size limit exceeded
        '503':
          description: Object storage or command bus unavailable
  /ingestion/video:
    post:
      operationId: uploadVideo
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: File signature validated, object stored, processing command
            queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionAccepted'
        '400':
          description: Invalid file, type mismatch, or size limit exceeded
        '503':
          description: Object storage or command bus unavailable
  /ingestion/jobs/{jobId}:
    get:
      operationId: getIngestionJob
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Authoritative ingestion job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionJob'
        '404':
          description: Ingestion job not found
  /postmortems:
    post:
      summary: Queue postmortem generation from completed investigation and reviewed
        evidence
      responses:
        '202':
          description: Postmortem generation queued
        '400':
          description: Invalid request
        '503':
          description: Durable queue unavailable
    get:
      summary: List tenant postmortems
      responses:
        '200':
          description: Postmortem list
  /postmortems/{postmortem_id}:
    get:
      summary: Get authoritative postmortem
      parameters:
      - name: postmortem_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Postmortem
        '404':
          description: Not found
  /postmortems/{postmortem_id}/review:
    post:
      summary: Approve, reject, or request changes
      parameters:
      - name: postmortem_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Review recorded
        '409':
          description: Version conflict or immutable
  /postmortems/{postmortem_id}/export:
    get:
      summary: Export approved final postmortem
      parameters:
      - name: postmortem_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: format
        in: query
        schema:
          type: string
          enum:
          - markdown
          - json
      responses:
        '200':
          description: Export payload
        '409':
          description: Not approved
  /investigations/page:
    get:
      operationId: pageInvestigations
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Opaque-cursor tenant-scoped investigation page
        '400':
          description: Invalid cursor
  /ingestion/uploads/handoff:
    post:
      operationId: createUploadHandoff
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '201':
          description: Short-lived object-store upload handoff; never a Python service
            URL
        '400':
          description: Invalid metadata
        '503':
          description: Object storage unavailable
  /ingestion/uploads/{jobId}/complete:
    post:
      operationId: completeUploadHandoff
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '202':
          description: Verified uploaded object queued for processing
        '409':
          description: Idempotency/resource mismatch
        '503':
          description: Object verification or command bus unavailable
  /agent-execution/{runId}:
    get:
      operationId: getAgentExecutionView
      summary: Get authoritative persisted agent execution view
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Persisted execution projection }
  /agent-execution/{runId}/events:
    get:
      operationId: replayAgentExecutionEvents
      summary: Replay persisted execution events after a sequence
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: after_sequence
          schema: { type: integer, minimum: 0 }
      responses:
        "200": { description: Ordered persisted runtime events }
  /agent-execution/{runId}/stream:
    get:
      operationId: streamAgentExecutionEvents
      summary: Stream persisted agent execution event batches
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: text/event-stream }
  /llmops/correlations/{correlationId}:
    get:
      operationId: getLLMOpsCorrelationTrace
      summary: Get tenant-scoped end-to-end LLMOps trace by correlation ID
      parameters:
        - in: path
          name: correlationId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200": { description: Redacted normalized LLMOps correlation trace }

components:
  parameters:
    TenantId:
      name: x-tenant-id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: x-user-id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: idempotency-key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CorrelationId:
      name: x-correlation-id
      in: header
      required: false
      schema:
        type: string
        format: uuid
  schemas:
    Health:
      type: object
      required:
      - status
      - service
      - version
      - timestamp
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties:
            type: string
    CreateReleaseRiskRequest:
      type: object
      additionalProperties: false
      required:
      - repository
      - release_id
      - commit_sha
      - policy
      properties:
        repository:
          type: string
          minLength: 3
          maxLength: 200
        release_id:
          type: string
          minLength: 1
          maxLength: 120
        commit_sha:
          type: string
          pattern: ^[A-Fa-f0-9]{7,64}$
        target_environment:
          type: string
          default: production
        policy:
          $ref: '#/components/schemas/ReleaseRiskPolicyInput'
        changed_file_details:
          type: array
          items:
            $ref: '#/components/schemas/ChangedFileInput'
    ChangedFileInput:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          type: string
        additions:
          type: integer
          minimum: 0
          default: 0
        deletions:
          type: integer
          minimum: 0
          default: 0
        language:
          type: [string, 'null']
        change_type:
          enum: [added, modified, deleted, renamed]
          default: modified
    ReleaseRiskPolicyInput:
      type: object
      additionalProperties: false
      required:
      - changed_files
      - changed_services
      properties:
        changed_files:
          type: integer
          minimum: 0
          maximum: 100000
        changed_services:
          type: integer
          minimum: 0
          maximum: 10000
        failed_workflows:
          type: integer
          minimum: 0
          default: 0
        database_migration_changed:
          type: boolean
          default: false
        rollback_plan_verified:
          type: boolean
          default: true
        production_incidents_last_30d:
          type: integer
          minimum: 0
          default: 0
        high_severity_incidents_last_30d:
          type: integer
          minimum: 0
          default: 0
        test_coverage_delta_percent:
          type: number
          minimum: -100
          maximum: 100
          default: 0
        security_scan_critical_findings:
          type: integer
          minimum: 0
          default: 0
        deployment_window_risk:
          type: integer
          minimum: 0
          maximum: 20
          default: 0
    ReleaseRiskRecord:
      type: object
      required:
      - assessment_id
      - tenant_id
      - correlation_id
      - repository
      - release_id
      - commit_sha
      - target_environment
      - status
      - policy_input
      - created_at
      - updated_at
      - version
      properties:
        assessment_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        requested_by:
          type: string
          format: uuid
        correlation_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        repository:
          type: string
        release_id:
          type: string
        commit_sha:
          type: string
        target_environment:
          type: string
        status:
          enum:
          - ACCEPTED
          - QUEUED
          - RUNNING
          - COMPLETED
          - FAILED
          - CANCELLED
        policy_input:
          $ref: '#/components/schemas/ReleaseRiskPolicyInput'
        changed_file_details:
          type: array
          items:
            $ref: '#/components/schemas/ChangedFileInput'
        result:
          $ref: '#/components/schemas/ReleaseRiskAssessment'
        error_code:
          type:
          - string
          - 'null'
        error_message:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    ReleaseRiskAssessment:
      type: object
      required:
      - assessment_id
      - release_id
      - score
      - level
      - decision
      - primary_risks
      - recommended_actions
      - evidence_ids
      - confidence
      - requires_human_review
      - factors
      - policy_version
      - calculated_at
      properties:
        assessment_id:
          type: string
          format: uuid
        release_id:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
        level:
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        decision:
          enum:
          - PROCEED
          - PROCEED_WITH_GUARDRAILS
          - DELAY
          - BLOCK
        primary_risks:
          type: array
          items:
            type: string
        recommended_actions:
          type: array
          items:
            type: string
        evidence_ids:
          type: array
          items:
            type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        requires_human_review:
          type: boolean
        factors:
          type: array
          items:
            type: object
            required:
            - code
            - label
            - points
            - observed_value
            - rationale
            properties:
              code:
                type: string
              label:
                type: string
              points:
                type: integer
                minimum: 0
                maximum: 100
              observed_value:
                type: string
              rationale:
                type: string
        policy_version:
          type: string
        calculated_at:
          type: string
          format: date-time
    CreateInvestigationRequest:
      type: object
      additionalProperties: false
      required:
      - query
      properties:
        query:
          type: string
          minLength: 10
          maxLength: 8000
        incident_id:
          type:
          - string
          - 'null'
          maxLength: 120
    InvestigationAccepted:
      type: object
      required:
      - investigation_id
      - correlation_id
      - status
      - authoritative
      properties:
        investigation_id:
          type: string
          format: uuid
        correlation_id:
          type: string
          format: uuid
        status:
          const: QUEUED
        authoritative:
          const: false
    InvestigationRecord:
      type: object
      required:
      - investigation_id
      - tenant_id
      - requested_by
      - correlation_id
      - idempotency_key
      - query
      - workflow_type
      - status
      - cancel_requested
      - last_sequence_number
      - created_at
      - updated_at
      - version
      properties:
        investigation_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        requested_by:
          type: string
          format: uuid
        correlation_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        query:
          type: string
        workflow_type:
          const: incident_investigation
        incident_id:
          type:
          - string
          - 'null'
        status:
          enum:
          - ACCEPTED
          - QUEUED
          - RUNNING
          - CANCELLING
          - CANCELLED
          - COMPLETED
          - FAILED
        cancel_requested:
          type: boolean
        cancel_reason:
          type:
          - string
          - 'null'
        last_sequence_number:
          type: integer
          minimum: 0
        error_code:
          type:
          - string
          - 'null'
        error_message:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    InvestigationEvent:
      type: object
      required:
      - event_id
      - event_type
      - schema_version
      - tenant_id
      - correlation_id
      - investigation_id
      - sequence_number
      - occurred_at
      - producer
      - trace_context
      - payload
      properties:
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
        schema_version:
          const: '1.0'
        tenant_id:
          type: string
          format: uuid
        correlation_id:
          type: string
          format: uuid
        investigation_id:
          type: string
          format: uuid
        sequence_number:
          type: integer
          minimum: 1
        occurred_at:
          type: string
          format: date-time
        producer:
          type: string
        trace_context:
          type: object
          additionalProperties:
            type: string
        payload:
          type: object
    IngestionAccepted:
      type: object
      required:
      - job_id
      - correlation_id
      - status
      - detected_mime_type
      - sha256
      - size_bytes
      - authoritative
      properties:
        job_id:
          type: string
          format: uuid
        correlation_id:
          type: string
          format: uuid
        status:
          const: QUEUED
        detected_mime_type:
          type: string
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        size_bytes:
          type: integer
          minimum: 1
        authoritative:
          const: false
    IngestionJob:
      type: object
      required:
      - job_id
      - tenant_id
      - requested_by
      - correlation_id
      - idempotency_key
      - modality
      - original_filename
      - detected_mime_type
      - size_bytes
      - sha256
      - bucket
      - object_key
      - status
      - last_sequence_number
      - created_at
      - updated_at
      - version
      properties:
        job_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        requested_by:
          type: string
          format: uuid
        correlation_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        modality:
          enum:
          - document
          - image
          - audio
          - video
        original_filename:
          type: string
        detected_mime_type:
          type: string
        size_bytes:
          type: integer
        sha256:
          type: string
        bucket:
          type: string
        object_key:
          type: string
        object_version:
          type:
          - string
          - 'null'
        status:
          enum:
          - ACCEPTED
