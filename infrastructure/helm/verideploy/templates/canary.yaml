{{- if .Values.canary.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verideploy-gateway-canary
  labels: {app.kubernetes.io/name: verideploy, app.kubernetes.io/component: gateway, verideploy.ai/track: canary}
spec:
  replicas: {{ .Values.canary.gateway.replicas }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {app.kubernetes.io/name: verideploy, app.kubernetes.io/component: gateway, verideploy.ai/track: canary}
  template:
    metadata:
      labels: {app.kubernetes.io/name: verideploy, app.kubernetes.io/component: gateway, verideploy.ai/track: canary}
    spec:
      serviceAccountName: verideploy
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ .Values.global.topologyKeyZone }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/component: gateway, verideploy.ai/track: canary}}
      containers:
        - name: gateway
          image: "{{ .Values.images.gateway.repository }}:{{ .Values.canary.gateway.imageTag }}"
          ports: [{name: http, containerPort: {{ .Values.workloads.gateway.port }}}]
          envFrom: [{secretRef: {name: {{ .Values.global.runtimeSecretName }}}}]
          resources: {{- toYaml .Values.workloads.gateway.resources | nindent 12 }}
          startupProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 5, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 15, failureThreshold: 3}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
---
apiVersion: v1
kind: Service
metadata:
  name: verideploy-gateway-canary
  annotations:
    verideploy.ai/max-traffic-percent: {{ .Values.canary.gateway.maxTrafficPercent | quote }}
spec:
  selector: {app.kubernetes.io/name: verideploy, app.kubernetes.io/component: gateway, verideploy.ai/track: canary}
  ports: [{name: http, port: {{ .Values.workloads.gateway.port }}, targetPort: http}]
{{- end }}
