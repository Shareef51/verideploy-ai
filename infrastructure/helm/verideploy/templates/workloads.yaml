{{- $root := . -}}
{{- range $name, $cfg := .Values.workloads }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verideploy-{{ $name }}
  labels:
    app.kubernetes.io/name: verideploy
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $cfg.replicas }}
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: verideploy
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: verideploy
        app.kubernetes.io/component: {{ $name }}
        verideploy.ai/track: stable
    spec:
      serviceAccountName: verideploy
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $root.Values.global.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ $root.Values.global.topologyKeyZone }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/component: {{ $name }}}
        - maxSkew: 1
          topologyKey: {{ $root.Values.global.topologyKeyHost }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/component: {{ $name }}}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: {{ $root.Values.global.topologyKeyHost }}
                labelSelector:
                  matchLabels: {app.kubernetes.io/component: {{ $name }}}
      containers:
        - name: {{ $name }}
          image: "{{- if eq $name "web" -}}{{ $root.Values.images.web.repository }}:{{ $root.Values.images.web.tag }}{{- else if eq $name "gateway" -}}{{ $root.Values.images.gateway.repository }}:{{ $root.Values.images.gateway.tag }}{{- else if eq $name "ai-service" -}}{{ $root.Values.images.ai.repository }}:{{ $root.Values.images.ai.tag }}{{- else -}}{{ $root.Values.images.worker.repository }}:{{ $root.Values.images.worker.tag }}{{- end -}}"
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          envFrom:
            - configMapRef: {name: verideploy-runtime-config}
            - secretRef: {name: {{ $root.Values.global.runtimeSecretName }}}
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          {{- if ne $name "worker" }}
          ports:
            - {name: http, containerPort: {{ $cfg.port }}}
          startupProbe:
            httpGet: {path: {{ $cfg.probes.startup.path }}, port: http}
            initialDelaySeconds: {{ $cfg.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ $cfg.probes.startup.periodSeconds }}
            failureThreshold: {{ $cfg.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet: {path: {{ $cfg.probes.readiness.path }}, port: http}
            periodSeconds: {{ $cfg.probes.readiness.periodSeconds }}
            failureThreshold: {{ $cfg.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet: {path: {{ $cfg.probes.liveness.path }}, port: http}
            periodSeconds: {{ $cfg.probes.liveness.periodSeconds }}
            failureThreshold: {{ $cfg.probes.liveness.failureThreshold }}
          {{- else }}
          startupProbe:
            exec: {command: ["python", "-c", "import os; os.kill(1, 0)"]}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec: {command: ["python", "-c", "import os; os.kill(1, 0)"]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: ["python", "-c", "import os; os.kill(1, 0)"]}
            periodSeconds: 20
          {{- end }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
---
{{- if ne $name "worker" }}
apiVersion: v1
kind: Service
metadata:
  name: verideploy-{{ $name }}
spec:
  selector:
    app.kubernetes.io/name: verideploy
    app.kubernetes.io/component: {{ $name }}
    verideploy.ai/track: stable
  ports:
    - {name: http, port: {{ $cfg.port }}, targetPort: http}
---
{{- end }}
{{- end }}
